name = "CompactProofLibrary"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Common", "LinearMaxK", "BruteForce", "LinearMaxKPlans", "Symmetry",
  "LinearMaxKColumnMax", "AttnClasses", "GrossCubic", "PathBrute", "GrossSub", "Instances"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

# The specification (Spec.lean: `Correct`, `numCorrect`), the exact evaluator and the counted
# language are CompactCheck's, pinned to one commit: entries prove theorems about those definitions,
# never about copies of them.
[[require]]
name = "CompactCheck"
git = "https://github.com/WFJKK/Auto-Research-Compact-Proof-in-Lean"
rev = "6f369e48e3e487965ef79ec3bb618d277528c1ac"

[[lean_lib]]
name = "Common"

[[lean_lib]]
name = "LinearMaxK"

[[lean_lib]]
name = "BruteForce"

[[lean_lib]]
name = "LinearMaxKPlans"

[[lean_lib]]
name = "Symmetry"

[[lean_lib]]
name = "LinearMaxKColumnMax"

[[lean_lib]]
name = "AttnClasses"

[[lean_lib]]
name = "GrossCubic"

[[lean_lib]]
name = "PathBrute"

[[lean_lib]]
name = "GrossSub"

# The protected modules of the instances, as the acceptance service generates them
# (CompactCheck's scripts/make_protected.py), so that the instances build here too.
[[lean_lib]]
name = "Protected"
srcDir = "instances"
globs = ["Protected.+"]
leanOptions = {weak.linter.mathlibStandardSet = false}

# One instance module per (entry, network): the checker, its soundness, the kernel's evaluation.
[[lean_lib]]
name = "Instances"
srcDir = "instances"
# Sequential elaboration, as the acceptance service compiles candidates: a module of many decided
# facts otherwise starts a thread per theorem.
leanOptions = {Elab.async = false}
globs = ["LinearMaxKInstances.+", "BruteForceInstances.+", "LinearMaxKPlansInstances.+",
  "SymmetryInstances.+", "LinearMaxKColumnMaxInstances.+", "AttnClassesInstances.+",
  "GrossCubicInstances.+", "PathBruteInstances.+", "GrossSubInstances.+"]

# `lake build measure`, then `lake exe measure <network.json> ...`: the checker on exported
# networks, compiled (not a default target: linking it compiles the Mathlib modules it imports).
[[lean_exe]]
name = "measure"
root = "Measure"

# `lake build measure_attn`, then `lake exe measure_attn <network.json> ...`: entry 6 on exported
# attention networks, compiled (not a default target).
[[lean_exe]]
name = "measure_attn"
root = "MeasureAttn"

# `lake build measure_gross`, then `lake exe measure_gross <network.json> ...`: entry 7 on exported
# attention networks, compiled (not a default target).
[[lean_exe]]
name = "measure_gross"
root = "MeasureGross"

# `lake build measure_sub`, then `lake exe measure_sub <network.json> <plan.json> ...`: entry 9 on
# exported attention networks with plans and certificates, compiled (not a default target).
[[lean_exe]]
name = "measure_sub"
root = "MeasureSub"
