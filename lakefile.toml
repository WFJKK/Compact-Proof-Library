name = "CompactProofLibrary"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Common", "LinearMaxK", "BruteForce", "LinearMaxKPlans", "Symmetry", "Instances"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

# The specification (Spec.lean: `Correct`, `numCorrect`), the exact evaluator and the counted
# language are CompactCheck's, pinned to one commit: entries prove theorems about those definitions,
# never about copies of them.
[[require]]
name = "CompactCheck"
git = "https://github.com/WFJKK/Auto-Research-Compact-Proof-in-Lean"
rev = "56f82f25ebd2e9bded57376422002e6c09129acf"

[[lean_lib]]
name = "Common"

[[lean_lib]]
name = "LinearMaxK"

[[lean_lib]]
name = "BruteForce"

[[lean_lib]]
name = "LinearMaxKPlans"

[[lean_lib]]
name = "Symmetry"

# The protected modules of the instances, as the acceptance service generates them
# (CompactCheck's scripts/make_protected.py), so that the instances build here too.
[[lean_lib]]
name = "Protected"
srcDir = "instances"
globs = ["Protected.+"]
leanOptions = {weak.linter.mathlibStandardSet = false}

# One instance module per (entry, network): the checker, its soundness, the kernel's evaluation.
[[lean_lib]]
name = "Instances"
srcDir = "instances"
globs = ["LinearMaxKInstances.+", "BruteForceInstances.+", "LinearMaxKPlansInstances.+",
  "SymmetryInstances.+"]

# `lake build measure`, then `lake exe measure <network.json> ...`: the checker on exported
# networks, compiled (not a default target: linking it compiles the Mathlib modules it imports).
[[lean_exe]]
name = "measure"
root = "Measure"
